<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HifzHub ödev bağlantısı</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.svg">
<style>
:root{--bg:#FFFBEA;--ink:#3F3F3F;--olive:#7A8B3C;--olive2:#5E7A2E;--soft:#E7EBD6;--muted:#77735f;--gold:#C98A1E;--wa:#1f9d55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px 16px}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:25px;font-weight:800}
p{margin:0}.muted{color:var(--muted);font-size:14.5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600}
input,textarea{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--olive);background:#fff;color:var(--ink)}
input{font-size:26px;font-weight:800;text-align:center}
textarea{min-height:92px;resize:vertical;font-size:15px}
.btn{display:block;width:100%;padding:14px;border-radius:999px;border:0;background:var(--olive);color:#fff;font:800 17px inherit;text-align:center;text-decoration:none;cursor:pointer}
.btn.wa{background:var(--wa)}.btn.t{background:var(--soft);color:var(--olive2)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:#b3261e;font-weight:600;min-height:1.5em}
.link{word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:14px;background:#fff;border:1px dashed var(--olive);border-radius:10px;padding:10px}
</style>
</head>
<body>
<main>
  <h1>Ödev bağlantısı oluştur</h1>
  <p class="muted">Aralığı yaz, mesajı WhatsApp grubuna gönder. Öğrenci bağlantıya dokununca HifzHub bu isimlerle açılır.</p>
  <div class="row">
    <label for="s">Başlangıç<input id="s" type="number" inputmode="numeric" min="1" max="99" value="1"></label>
    <label for="e">Bitiş<input id="e" type="number" inputmode="numeric" min="1" max="99" value="5"></label>
  </div>
  <p class="err" id="err" role="alert"></p>
  <label for="msg">Mesaj<textarea id="msg"></textarea></label>
  <div class="link" id="link"></div>
  <a class="btn wa" id="wa" href="#" target="_blank" rel="noopener">WhatsApp'ta gönder</a>
  <button class="btn t" id="copy" type="button">Mesajı kopyala</button>
  <p class="muted">İpucu: Bu sayfayı telefonunun ana ekranına ekleyebilirsin (tarayıcı menüsü → "Ana ekrana ekle").</p>
</main>
<script>
(function(){
  var base=location.origin+"/odev/?";
  var s=document.getElementById("s"), e=document.getElementById("e"), msg=document.getElementById("msg");
  var link=document.getElementById("link"), wa=document.getElementById("wa"), err=document.getElementById("err"), copy=document.getElementById("copy");
  var custom=false;
  try{var saved=JSON.parse(localStorage.getItem("odev")||"null"); if(saved){s.value=saved.s;e.value=saved.e}}catch(x){}
  function text(a,b,url){return "Bu haftanın ödevi: "+a+"-"+b+" arası isimler 🌿\n"+url}
  function update(){
    var a=parseInt(s.value,10), b=parseInt(e.value,10);
    var ok=a>=1&&b<=99&&a<=b;
    err.textContent=ok?"":"Başlangıç 1-99 arasında ve bitişten küçük ya da eşit olmalı.";
    wa.hidden=copy.hidden=link.hidden=!ok; if(!ok) return;
    var url=base+a+"-"+b;
    link.textContent=url;
    if(!custom) msg.value=text(a,b,url);
    wa.href="https://wa.me/?text="+encodeURIComponent(msg.value);
    try{localStorage.setItem("odev",JSON.stringify({s:a,e:b}))}catch(x){}
  }
  s.addEventListener("input",function(){custom=false;update()});
  e.addEventListener("input",function(){custom=false;update()});
  msg.addEventListener("input",function(){custom=true;wa.href="https://wa.me/?text="+encodeURIComponent(msg.value)});
  copy.addEventListener("click",function(){
    var done=function(){copy.textContent="Kopyalandı ✓";setTimeout(function(){copy.textContent="Mesajı kopyala"},1600)};
    if(navigator.clipboard){navigator.clipboard.writeText(msg.value).then(done,function(){msg.select()})}else{msg.select();try{document.execCommand("copy");done()}catch(x){}}
  });
  update();
})();
</script>
</body>
</html>
